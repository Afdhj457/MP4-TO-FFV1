<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- 已添加禁止缩放的配置 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MP4 · 转 FFV1 (无损编码) · 预览 + 下载</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      border-radius: 28px;
      box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      padding: 28px;
      max-width: 1000px;
      width: 100%;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      margin: 0 0 6px 0;
      background: linear-gradient(135deg, #e2e8f0, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .subtitle {
      color: #94a3b8;
      margin-top: -4px;
      margin-bottom: 24px;
      font-size: 0.95rem;
      border-left: 3px solid #3b82f6;
      padding-left: 14px;
      font-weight: 400;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
    .panel {
      background: #0f172a;
      border-radius: 20px;
      padding: 16px;
      border: 1px solid #334155;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
    }
    .panel-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #60a5fa;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .preview-container {
      border-radius: 14px;
      overflow: hidden;
      background: #020617;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #1e293b;
    }
    .preview-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .placeholder {
      color: #475569;
      font-size: 0.9rem;
      text-align: center;
      padding: 20px;
    }
    .file-input-wrapper {
      margin-top: 16px;
    }
    .file-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #1e293b;
      border: 1.5px dashed #3b82f6;
      border-radius: 16px;
      padding: 16px 20px;
      color: #bfdbfe;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      font-size: 1rem;
    }
    .file-label:hover {
      background: #1e2a3f;
      border-color: #60a5fa;
    }
    .file-label svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #3b82f6;
      stroke-width: 2;
    }
    input[type="file"] {
      display: none;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      color: #cbd5e1;
      font-size: 0.9rem;
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 12px;
    }
    .badge {
      background: #0f172a;
      padding: 4px 12px;
      border-radius: 30px;
      font-family: monospace;
      font-weight: 500;
      color: #93c5fd;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }
    button {
      background: #1e293b;
      border: none;
      padding: 14px 22px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      flex: 1 1 auto;
      border: 1px solid #334155;
      color: #e2e8f0;
    }
    button.primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: white;
      box-shadow: 0 8px 18px -6px #1e3a8a;
    }
    button.primary:hover:not(:disabled) {
      background: #1d4ed8;
      transform: scale(1.01);
    }
    button.secondary {
      background: #2d3a4e;
      border-color: #475569;
    }
    button.secondary:hover:not(:disabled) {
      background: #3b4a62;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }
    .status {
      margin-top: 16px;
      background: #0f172a;
      border-radius: 16px;
      padding: 14px 16px;
      font-family: monospace;
      font-size: 0.9rem;
      color: #a5b4fc;
      border-left: 6px solid #3b82f6;
      word-break: break-word;
    }
    .status.error {
      border-left-color: #ef4444;
      color: #fca5a5;
    }
    .status.success {
      border-left-color: #22c55e;
      color: #86efac;
    }
    .download-area {
      margin-top: 20px;
      text-align: center;
    }
    .download-btn {
      background: #059669;
      border-color: #10b981;
      padding: 16px 28px;
      width: 100%;
      justify-content: center;
      font-size: 1.1rem;
      letter-spacing: 0.3px;
    }
    .download-btn:hover:not(:disabled) {
      background: #047857;
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.7s linear infinite;
      margin-right: 6px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .ffv1-badge {
      background: #1e293b;
      color: #a78bfa;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 30px;
      font-family: monospace;
      border: 1px solid #4c1d95;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-linecap="round">
      <rect x="2" y="4" width="20" height="16" rx="3" />
      <path d="M9 8v8M15 8v8M9 12h6" />
    </svg>
    MP4 → FFV1
  </h1>
  <div class="subtitle">无损视频编码 · 浏览器预览 · 直接下载</div>

  <div class="grid">
    <!-- 左侧预览区域 -->
    <div class="panel">
      <div class="panel-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        预览 (原始 MP4)
      </div>
      <div class="preview-container" id="previewContainer">
        <div class="placeholder" id="previewPlaceholder">
          ⚡ 上传 MP4 后在此预览
        </div>
        <video id="videoPreview" controls style="display: none;" playsinline></video>
      </div>
      <div class="file-input-wrapper">
        <label for="fileInput" class="file-label" id="fileLabel">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          <span id="fileLabelText">选择 MP4 文件</span>
        </label>
        <input type="file" id="fileInput" accept="video/mp4,video/*" />
      </div>
      <div class="info-row">
        <span>📁 文件名</span>
        <span class="badge" id="fileNameDisplay">—</span>
      </div>
    </div>

    <!-- 右侧转换 & 下载区域 -->
    <div class="panel">
      <div class="panel-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        FFV1 无损编码
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span class="ffv1-badge">FFV1 · 无损 · MKV 封装</span>
        <span style="color: #64748b; font-size: 0.75rem;">(通过 WebAssembly 转换)</span>
      </div>

      <div class="actions">
        <button class="primary" id="convertBtn" disabled>
          <span id="convertSpinner" class="spinner" style="display: none;"></span>
          <span id="convertBtnText">开始转换</span>
        </button>
        <button class="secondary" id="resetBtn" disabled>重置</button>
      </div>

      <div id="statusMessage" class="status">
        等待上传 MP4 文件…
      </div>

      <!-- 下载区域 -->
      <div class="download-area">
        <button class="download-btn" id="downloadBtn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px;">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          下载 FFV1 文件 (.mkv)
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 引入 FFmpeg 0.12.x (UMD 版本) 和 工具库 -->
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/util.min.js"></script>

<script>
  (async function() {
    // ---------- DOM 元素 ----------
    const fileInput = document.getElementById('fileInput');
    const fileLabelText = document.getElementById('fileLabelText');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const videoPreview = document.getElementById('videoPreview');
    const previewPlaceholder = document.getElementById('previewPlaceholder');
    const convertBtn = document.getElementById('convertBtn');
    const convertBtnText = document.getElementById('convertBtnText');
    const convertSpinner = document.getElementById('convertSpinner');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusMessage = document.getElementById('statusMessage');

    // ---------- 状态 ----------
    let currentFile = null;          // 原始 MP4 File 对象
    let ffmpeg = null;               // FFmpeg 实例
    let ffmpegLoaded = false;        // 是否已加载
    let convertedBlob = null;        // 转换后的 blob (MKV)
    let isConverting = false;

    // ---------- 工具函数 ----------
    function setStatus(text, type = 'info') {
      statusMessage.textContent = text;
      statusMessage.className = 'status';
      if (type === 'error') statusMessage.classList.add('error');
      if (type === 'success') statusMessage.classList.add('success');
    }

    function updateButtonState() {
      // 转换按钮: 有文件且ffmpeg就绪且不在转换中 且 还没有转换结果
      const canConvert = !!currentFile && ffmpegLoaded && !isConverting && !convertedBlob;
      convertBtn.disabled = !canConvert;
      // 重置按钮: 有文件 或 有转换结果
      resetBtn.disabled = (!currentFile && !convertedBlob) || isConverting;
      // 下载按钮: 有转换结果
      downloadBtn.disabled = !convertedBlob;
      
      // 如果正在进行转换，禁用文件选择框，防止误操作
      fileInput.disabled = isConverting;
    }

    // 清理预览和文件状态
    function resetFileState(keepStatus = false) {
      if (isConverting) return;

      if (videoPreview.src) {
        URL.revokeObjectURL(videoPreview.src);
        videoPreview.src = '';
      }
      videoPreview.style.display = 'none';
      previewPlaceholder.style.display = 'block';
      fileNameDisplay.textContent = '—';
      fileLabelText.textContent = '选择 MP4 文件';
      fileInput.value = '';

      if (convertedBlob) {
        convertedBlob = null;
      }

      currentFile = null;

      if (!keepStatus) {
        setStatus('等待上传 MP4 文件…', 'info');
      }
      updateButtonState();
    }

    // 加载 FFmpeg (只加载一次) - 使用 0.12.x 的最新 API
    async function ensureFFmpegLoaded() {
      if (ffmpegLoaded) return true;
      if (isConverting) return false;

      try {
        setStatus('加载 FFmpeg 核心 (WebAssembly) … 请稍候', 'info');
        
        // 从 UMD 全局变量中获取类和方法
        const { FFmpeg } = FFmpegWASM;
        const { toBlobURL } = FFmpegUtil;
        
        ffmpeg = new FFmpeg();
        
        // 拦截日志，可选择性输出
        ffmpeg.on('log', ({ message }) => {
          console.log('[FFmpeg]', message);
        });

        // 指定核心的 CDN 地址，并使用 toBlobURL 解决跨域问题
        const baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd';
        await ffmpeg.load({
          coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
          wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
        });

        ffmpegLoaded = true;
        setStatus('FFmpeg 就绪，可以开始转换', 'success');
        updateButtonState();
        return true;
      } catch (err) {
        console.error('FFmpeg 加载失败:', err);
        setStatus(`FFmpeg 加载失败: ${err.message || '请检查网络或控制台'}`, 'error');
        ffmpegLoaded = false;
        updateButtonState();
        return false;
      }
    }

    // ---------- 文件选择 ----------
    fileInput.addEventListener('change', async (e) => {
      if (isConverting) return; // 转换中禁止选择

      const file = e.target.files?.[0];
      if (!file) return;

      if (!file.type.includes('mp4') && !file.name.toLowerCase().endsWith('.mp4')) {
        setStatus('请选择有效的 MP4 文件', 'error');
        fileInput.value = '';
        return;
      }

      resetFileState(true);
      currentFile = file;

      // 更新 UI
      fileNameDisplay.textContent = file.name.length > 30 ? file.name.slice(0, 27) + '…' : file.name;
      fileLabelText.textContent = '重新选择 MP4';

      // 创建预览
      const videoUrl = URL.createObjectURL(file);
      videoPreview.src = videoUrl;
      videoPreview.style.display = 'block';
      previewPlaceholder.style.display = 'none';
      videoPreview.load();

      setStatus(`已选择: ${file.name} (${(file.size / (1024 * 1024)).toFixed(2)} MB)`, 'info');

      // 异步加载 FFmpeg
      if (!ffmpegLoaded) {
        ensureFFmpegLoaded().catch(console.warn);
      } else {
        updateButtonState();
      }

      if (convertedBlob) {
        convertedBlob = null;
        updateButtonState();
      }
    });

    // ---------- 转换逻辑 ----------
    async function convertToFFV1() {
      if (!currentFile) {
        setStatus('请先上传 MP4 文件', 'error');
        return;
      }
      if (!ffmpegLoaded) {
        const loaded = await ensureFFmpegLoaded();
        if (!loaded) return;
      }
      if (isConverting) return;

      if (convertedBlob) {
        convertedBlob = null;
        updateButtonState();
      }

      isConverting = true;
      convertSpinner.style.display = 'inline-block';
      convertBtnText.textContent = '转换中…';
      updateButtonState();

      try {
        setStatus('开始转换：正在读取文件…', 'info');
        // 0.12.x 使用 fetchFile
        const { fetchFile } = FFmpegWASM;
        const fileData = await fetchFile(currentFile);

        const inputFileName = 'input.mp4';
        const outputFileName = 'output.mkv';

        setStatus('正在写入虚拟文件系统…', 'info');
        await ffmpeg.writeFile(inputFileName, fileData);

        setStatus('FFV1 编码中 (无损压缩，文件可能很大，请耐心等待)…', 'info');

        // 执行 FFmpeg 命令
        await ffmpeg.exec([
          '-i', inputFileName,
          '-c:v', 'ffv1',
          '-level', '3',
          '-coder', '1',
          '-context', '1',
          '-g', '1',
          '-c:a', 'copy',
          '-f', 'matroska',
          outputFileName
        ]);

        setStatus('转换完成，正在读取输出文件…', 'info');
        const outputData = await ffmpeg.readFile(outputFileName);
        
        // 使用 Blob 包装
        convertedBlob = new Blob([outputData.buffer], { type: 'video/x-matroska' });

        // 清理虚拟文件
        await ffmpeg.deleteFile(inputFileName);
        await ffmpeg.deleteFile(outputFileName);

        setStatus(`✅ 转换成功！FFV1 文件已准备好 (${(convertedBlob.size / (1024 * 1024)).toFixed(2)} MB)`, 'success');
        updateButtonState();

      } catch (err) {
        console.error('转换失败:', err);
        setStatus(`❌ 转换失败: ${err.message || '请查看控制台了解更多'}`, 'error');
        try {
          await ffmpeg.deleteFile('input.mp4');
          await ffmpeg.deleteFile('output.mkv');
        } catch (e) {}
      } finally {
        isConverting = false;
        convertSpinner.style.display = 'none';
        convertBtnText.textContent = '开始转换';
        updateButtonState();
      }
    }

    // ---------- 下载 ----------
    function downloadConverted() {
      if (!convertedBlob) {
        setStatus('没有可下载的转换文件', 'error');
        return;
      }
      const url = URL.createObjectURL(convertedBlob);
      const a = document.createElement('a');
      a.href = url;
      const baseName = currentFile ? currentFile.name.replace(/\.[^/.]+$/, '') : 'video';
      a.download = `${baseName}_ffv1.mkv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      setStatus('下载已开始', 'success');
    }

    // ---------- 重置 ----------
    function resetAll() {
      if (isConverting) {
        setStatus('转换中，请等待完成后再重置', 'error');
        return;
      }
      if (convertedBlob) {
        convertedBlob = null;
      }
      resetFileState(false);
      setStatus('等待上传 MP4 文件…', 'info');
      updateButtonState();
    }

    // ---------- 事件绑定 ----------
    convertBtn.addEventListener('click', convertToFFV1);
    resetBtn.addEventListener('click', resetAll);
    downloadBtn.addEventListener('click', downloadConverted);

    // 初始状态
    updateButtonState();
  })();
</script>
</body>
</html>
