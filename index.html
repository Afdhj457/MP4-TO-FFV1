<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP4 · 转 FFV1 (无损编码) · 预览 + 下载</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      border-radius: 28px;
      box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      padding: 28px;
      max-width: 1000px;
      width: 100%;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      margin: 0 0 6px 0;
      background: linear-gradient(135deg, #e2e8f0, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .subtitle {
      color: #94a3b8;
      margin-top: -4px;
      margin-bottom: 24px;
      font-size: 0.95rem;
      border-left: 3px solid #3b82f6;
      padding-left: 14px;
      font-weight: 400;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
    .panel {
      background: #0f172a;
      border-radius: 20px;
      padding: 16px;
      border: 1px solid #334155;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
    }
    .panel-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #60a5fa;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .preview-container {
      border-radius: 14px;
      overflow: hidden;
      background: #020617;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #1e293b;
    }
    .preview-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .placeholder {
      color: #475569;
      font-size: 0.9rem;
      text-align: center;
      padding: 20px;
    }
    .file-input-wrapper {
      margin-top: 16px;
    }
    .file-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #1e293b;
      border: 1.5px dashed #3b82f6;
      border-radius: 16px;
      padding: 16px 20px;
      color: #bfdbfe;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      font-size: 1rem;
    }
    .file-label:hover {
      background: #1e2a3f;
      border-color: #60a5fa;
    }
    .file-label svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #3b82f6;
      stroke-width: 2;
    }
    input[type="file"] {
      display: none;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      color: #cbd5e1;
      font-size: 0.9rem;
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 12px;
    }
    .badge {
      background: #0f172a;
      padding: 4px 12px;
      border-radius: 30px;
      font-family: monospace;
      font-weight: 500;
      color: #93c5fd;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }
    button {
      background: #1e293b;
      border: none;
      padding: 14px 22px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      flex: 1 1 auto;
      border: 1px solid #334155;
      color: #e2e8f0;
    }
    button.primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: white;
      box-shadow: 0 8px 18px -6px #1e3a8a;
    }
    button.primary:hover:not(:disabled) {
      background: #1d4ed8;
      transform: scale(1.01);
    }
    button.secondary {
      background: #2d3a4e;
      border-color: #475569;
    }
    button.secondary:hover:not(:disabled) {
      background: #3b4a62;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }
    .status {
      margin-top: 16px;
      background: #0f172a;
      border-radius: 16px;
      padding: 14px 16px;
      font-family: monospace;
      font-size: 0.9rem;
      color: #a5b4fc;
      border-left: 6px solid #3b82f6;
      word-break: break-word;
    }
    .status.error {
      border-left-color: #ef4444;
      color: #fca5a5;
    }
    .status.success {
      border-left-color: #22c55e;
      color: #86efac;
    }
    .download-area {
      margin-top: 20px;
      text-align: center;
    }
    .download-btn {
      background: #059669;
      border-color: #10b981;
      padding: 16px 28px;
      width: 100%;
      justify-content: center;
      font-size: 1.1rem;
      letter-spacing: 0.3px;
    }
    .download-btn:hover:not(:disabled) {
      background: #047857;
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.7s linear infinite;
      margin-right: 6px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .ffv1-badge {
      background: #1e293b;
      color: #a78bfa;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 30px;
      font-family: monospace;
      border: 1px solid #4c1d95;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-linecap="round">
      <rect x="2" y="4" width="20" height="16" rx="3" />
      <path d="M9 8v8M15 8v8M9 12h6" />
    </svg>
    MP4 → FFV1
  </h1>
  <div class="subtitle">无损视频编码 · 浏览器预览 · 直接下载</div>

  <div class="grid">
    <!-- 左侧预览区域 -->
    <div class="panel">
      <div class="panel-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        预览 (原始 MP4)
      </div>
      <div class="preview-container" id="previewContainer">
        <div class="placeholder" id="previewPlaceholder">
          ⚡ 上传 MP4 后在此预览
        </div>
        <video id="videoPreview" controls style="display: none;" playsinline></video>
      </div>
      <div class="file-input-wrapper">
        <label for="fileInput" class="file-label" id="fileLabel">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          <span id="fileLabelText">选择 MP4 文件</span>
        </label>
        <input type="file" id="fileInput" accept="video/mp4,video/*" />
      </div>
      <div class="info-row">
        <span>📁 文件名</span>
        <span class="badge" id="fileNameDisplay">—</span>
      </div>
    </div>

    <!-- 右侧转换 & 下载区域 -->
    <div class="panel">
      <div class="panel-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        FFV1 无损编码
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span class="ffv1-badge">FFV1 · 无损 · MKV 封装</span>
        <span style="color: #64748b; font-size: 0.75rem;">(通过 WebAssembly 转换)</span>
      </div>

      <div class="actions">
        <button class="primary" id="convertBtn" disabled>
          <span id="convertSpinner" class="spinner" style="display: none;"></span>
          <span id="convertBtnText">开始转换</span>
        </button>
        <button class="secondary" id="resetBtn" disabled>重置</button>
      </div>

      <div id="statusMessage" class="status">
        等待上传 MP4 文件…
      </div>

      <!-- 下载区域 -->
      <div class="download-area">
        <button class="download-btn" id="downloadBtn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px;">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          下载 FFV1 文件 (.mkv)
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 引入 FFmpeg.wasm 核心 (用于演示，实际使用需要加载多线程/单线程版本) -->
<!-- 注意：这里使用 @ffmpeg/ffmpeg 4.x 版本，通过 CDN 引入。由于浏览器安全限制，实际转换需要较长时间，但完全可运行。 -->
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.min.js"></script>
<script>
  (async function() {
    // ---------- DOM 元素 ----------
    const fileInput = document.getElementById('fileInput');
    const fileLabelText = document.getElementById('fileLabelText');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const videoPreview = document.getElementById('videoPreview');
    const previewPlaceholder = document.getElementById('previewPlaceholder');
    const convertBtn = document.getElementById('convertBtn');
    const convertBtnText = document.getElementById('convertBtnText');
    const convertSpinner = document.getElementById('convertSpinner');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusMessage = document.getElementById('statusMessage');

    // ---------- 状态 ----------
    let currentFile = null;          // 原始 MP4 File 对象
    let ffmpeg = null;              // FFmpeg 实例
    let ffmpegLoaded = false;       // 是否已加载
    let convertedBlob = null;       // 转换后的 blob (MKV)
    let isConverting = false;

    // ---------- 工具函数 ----------
    function setStatus(text, type = 'info') {
      statusMessage.textContent = text;
      statusMessage.className = 'status'; // 重置
      if (type === 'error') statusMessage.classList.add('error');
      if (type === 'success') statusMessage.classList.add('success');
    }

    function updateButtonState() {
      // 转换按钮: 有文件且ffmpeg就绪且不在转换中 且 还没有转换结果
      const canConvert = !!currentFile && ffmpegLoaded && !isConverting && !convertedBlob;
      convertBtn.disabled = !canConvert;
      // 重置按钮: 有文件 或 有转换结果
      resetBtn.disabled = (!currentFile && !convertedBlob) || isConverting;
      // 下载按钮: 有转换结果
      downloadBtn.disabled = !convertedBlob;
    }

    // 清理预览和文件状态 (不清理ffmpeg)
    function resetFileState(keepStatus = false) {
      if (isConverting) return; // 转换中不允许重置

      // 释放 video src
      if (videoPreview.src) {
        URL.revokeObjectURL(videoPreview.src);
        videoPreview.src = '';
      }
      videoPreview.style.display = 'none';
      previewPlaceholder.style.display = 'block';
      fileNameDisplay.textContent = '—';
      fileLabelText.textContent = '选择 MP4 文件';
      fileInput.value = '';

      // 清理转换结果
      if (convertedBlob) {
        // 如果有下载链接也清理 (没有实际链接，blob 由 URL 管理)
        convertedBlob = null;
      }

      currentFile = null;

      // 如果ffmpeg已经加载，无需重置
      if (!keepStatus) {
        setStatus('等待上传 MP4 文件…', 'info');
      }
      updateButtonState();
    }

    // 加载 FFmpeg (只加载一次)
    async function ensureFFmpegLoaded() {
      if (ffmpegLoaded) return true;
      if (isConverting) return false;

      try {
        setStatus('加载 FFmpeg 核心 (WebAssembly) …', 'info');
        // 使用单线程版本，兼容性更好
        const { createFFmpeg, fetchFile } = FFmpeg;
        ffmpeg = createFFmpeg({
          log: true, // 减少控制台噪音可设为 false
          corePath: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/ffmpeg-core.js',
        });

        // 加载核心
        await ffmpeg.load();
        ffmpegLoaded = true;
        setStatus('FFmpeg 就绪，可以开始转换', 'success');
        updateButtonState();
        return true;
      } catch (err) {
        console.error('FFmpeg 加载失败:', err);
        setStatus(`FFmpeg 加载失败: ${err.message || '请检查网络或控制台'}`, 'error');
        ffmpegLoaded = false;
        updateButtonState();
        return false;
      }
    }

    // ---------- 文件选择 ----------
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      // 简单验证 MP4 类型 (有些文件type可能为空)
      if (!file.type.includes('mp4') && !file.name.toLowerCase().endsWith('.mp4')) {
        setStatus('请选择有效的 MP4 文件', 'error');
        fileInput.value = '';
        return;
      }

      // 重置之前的状态 (保留 ffmpeg 加载状态)
      resetFileState(true);
      currentFile = file;

      // 更新 UI
      fileNameDisplay.textContent = file.name.length > 30 ? file.name.slice(0, 27) + '…' : file.name;
      fileLabelText.textContent = '重新选择 MP4';

      // 创建预览
      const videoUrl = URL.createObjectURL(file);
      videoPreview.src = videoUrl;
      videoPreview.style.display = 'block';
      previewPlaceholder.style.display = 'none';

      // 确保视频元数据加载后可以播放
      videoPreview.load();

      setStatus(`已选择: ${file.name} (${(file.size / (1024 * 1024)).toFixed(2)} MB)`, 'info');

      // 如果 ffmpeg 未加载，则开始加载 (不阻塞预览)
      if (!ffmpegLoaded) {
        // 异步加载，不等待
        ensureFFmpegLoaded().catch(console.warn);
      } else {
        updateButtonState();
      }

      // 如果有之前转换的结果，重置
      if (convertedBlob) {
        convertedBlob = null;
        updateButtonState();
      }
    });

    // ---------- 转换逻辑 ----------
    async function convertToFFV1() {
      if (!currentFile) {
        setStatus('请先上传 MP4 文件', 'error');
        return;
      }
      if (!ffmpegLoaded) {
        const loaded = await ensureFFmpegLoaded();
        if (!loaded) return;
      }
      if (isConverting) return;

      // 先清理之前的结果
      if (convertedBlob) {
        convertedBlob = null;
        updateButtonState();
      }

      isConverting = true;
      convertSpinner.style.display = 'inline-block';
      convertBtnText.textContent = '转换中…';
      updateButtonState();

      try {
        setStatus('开始转换：正在读取文件…', 'info');
        const { fetchFile } = FFmpeg;  // 已经解构，但这里是局部
        // 注意: fetchFile 在 FFmpeg 对象上，上面解构过了
        // 但是之前解构是在 ensureFFmpegLoaded 函数内，全局使用需要重新获取
        // 为了避免混乱，直接从全局 FFmpeg 获取 fetchFile
        const fileData = await FFmpeg.fetchFile(currentFile);

        const inputFileName = 'input.mp4';
        const outputFileName = 'output.mkv';

        setStatus('正在写入虚拟文件系统…', 'info');
        ffmpeg.FS('writeFile', inputFileName, fileData);

        setStatus('FFV1 编码中 (无损，可能较慢，请耐心等待)…', 'info');

        // 运行 FFmpeg 命令:
        // -i input.mp4 输入
        // -c:v ffv1  视频编码 FFV1
        // -level 3   常用级别，兼容性好 (可选)
        // -coder 1   使用 range coder (可选)
        // -context 1  (可选)
        // -g 1       每帧关键帧，无损且便于剪辑 (增大文件体积)
        // -c:a copy  音频直接复制 (MP4中通常是AAC，MKV支持)
        // -f matroska 输出格式
        // 为了减小体积，可以不加 -g 1，但无损且预览友好我们保留默认
        // 注意: FFV1 默认为无损，不需要额外参数
        await ffmpeg.run(
          '-i', inputFileName,
          '-c:v', 'ffv1',
          '-level', '3',
          '-coder', '1',
          '-context', '1',
          '-g', '1',           // 每帧关键帧，保证无损帧精确，但体积大
          '-c:a', 'copy',      // 音频直接复制 (如果源是AAC，MKV封装没问题)
          '-f', 'matroska',
          outputFileName
        );

        setStatus('转换完成，正在读取输出文件…', 'info');
        const outputData = ffmpeg.FS('readFile', outputFileName);
        // 创建 Blob
        convertedBlob = new Blob([outputData.buffer], { type: 'video/x-matroska' });

        // 清理虚拟文件
        ffmpeg.FS('unlink', inputFileName);
        ffmpeg.FS('unlink', outputFileName);

        setStatus(`✅ 转换成功！FFV1 文件已准备好 (${(convertedBlob.size / (1024 * 1024)).toFixed(2)} MB)`, 'success');
        updateButtonState();

      } catch (err) {
        console.error('转换失败:', err);
        setStatus(`❌ 转换失败: ${err.message || '请查看控制台了解更多'}`, 'error');
        // 尝试清理虚拟文件 (可能未创建)
        try {
          if (ffmpeg.FS('readdir', '/').includes('input.mp4')) ffmpeg.FS('unlink', 'input.mp4');
          if (ffmpeg.FS('readdir', '/').includes('output.mkv')) ffmpeg.FS('unlink', 'output.mkv');
        } catch (e) {}
      } finally {
        isConverting = false;
        convertSpinner.style.display = 'none';
        convertBtnText.textContent = '开始转换';
        updateButtonState();
      }
    }

    // ---------- 下载 ----------
    function downloadConverted() {
      if (!convertedBlob) {
        setStatus('没有可下载的转换文件', 'error');
        return;
      }
      const url = URL.createObjectURL(convertedBlob);
      const a = document.createElement('a');
      a.href = url;
      // 命名: 原文件名 + _ffv1.mkv
      const baseName = currentFile ? currentFile.name.replace(/\.[^/.]+$/, '') : 'video';
      a.download = `${baseName}_ffv1.mkv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      // 延迟释放 URL
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      setStatus('下载已开始', 'success');
    }

    // ---------- 重置 ----------
    function resetAll() {
      if (isConverting) {
        setStatus('转换中，请等待完成后再重置', 'error');
        return;
      }
      // 清理转换结果
      if (convertedBlob) {
        convertedBlob = null;
      }
      // 重置文件状态 (会清理预览等)
      resetFileState(false);

      // 如果之前有错误状态，重置为等待
      setStatus('等待上传 MP4 文件…', 'info');
      updateButtonState();
    }

    // ---------- 事件绑定 ----------
    convertBtn.addEventListener('click', convertToFFV1);
    resetBtn.addEventListener('click', resetAll);
    downloadBtn.addEventListener('click', downloadConverted);

    // 初始状态：禁用按钮
    updateButtonState();

    // 预加载 FFmpeg 核心（在后台加载，不阻塞界面），但为了避免干扰，选择在用户选择文件后触发。
    // 也可以在这里就触发，不过有些浏览器会警告。我们选择在文件选择时加载。
    // 但为了让体验更顺畅，可以在页面加载后延迟加载 (避免占用带宽影响预览)
    // 采用用户首次点击选择文件时再加载，因为我们在change事件中调用了 ensureFFmpegLoaded
    // 如果用户先点击转换按钮但还没选择文件，会提示。

    // 但为了确保用户在选择文件后能快速就绪，我们已经在 change 事件里调用 ensureFFmpegLoaded
    // 但用户可能在加载完成前点击转换，这时会等待加载。没问题。

    // 额外优化: 如果用户直接点击转换 (但按钮是禁用的，所以没问题)

    // 修复: 如果用户文件选择后 ffmpeg 还在加载，转换按钮依然禁用，直到加载完成
    // 这就需要 ensureFFmpegLoaded 更新按钮状态。
    // 我们在 ensureFFmpegLoaded 的 finally 或成功里调用 updateButtonState

    // 但 ensureFFmpegLoaded 内部调用了 updateButtonState。但可能由于闭包 currentFile 更新不及时？
